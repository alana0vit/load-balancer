global
    daemon
    maxconn 256
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    log global
    option httplog
    
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s

frontend http_front
    bind *:80
    default_backend app_back

backend app_back
    balance roundrobin

    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s fall 2 rise 2

    server app-01 app-01:3000 check
    server app-02 app-02:3000 check
    server app-03 app-03:3000 check
    # server app-04 app-04:3000 check
